# Use a real node_modules tree (not Yarn PnP). Required so Turbopack — a Rust
# binary that resolves packages from the filesystem — can find next/package.json
# in CI. Without this, CI falls back to Yarn 4's PnP default (no node_modules)
# and `next build` fails with a workspace-root / "couldn't find Next.js" error.
nodeLinker: node-modules

# Block dependency install scripts by default (supply-chain hardening — a
# malicious/compromised package can't run code at install time). sharp,
# unrs-resolver, and other native deps in this tree resolve prebuilt
# binaries via platform optionalDependencies (e.g. @img/sharp-linux-x64),
# not postinstall scripts, so this doesn't affect the build. If a future
# dependency genuinely needs its install script, allow it explicitly with
# `dependenciesMeta.<name>.built: true` in package.json rather than
# flipping this back to true.
enableScripts: false
